name: Sync Feishu Community Jobs

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync from Feishu Base
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        run: python3 scripts/sync-feishu.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add community-jobs.json validity.json
          if git diff --staged --quiet; then
            echo "No community job or validity changes"
          else
            git commit -m "Sync community jobs & validity from Feishu ($(date +%Y-%m-%dT%H:%M))"
            git push
            echo "Pushed updated community-jobs.json & validity.json"
          fi