name: Process Job Submission

on:
  issues:
    types: [opened, labeled]

jobs:
  process:
    if: |
      github.event.action == 'opened' ||
      (github.event.action == 'labeled' && github.event.label.name == 'job-submission')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Label issue if not labeled
        if: github.event.action == 'opened'
        run: |
          gh issue edit ${{ github.event.issue.number }} \
            --add-label "job-submission" \
            --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Parse and append job
        run: |
          ISSUE_BODY=$(cat <<'ISSUE_EOF'
          ${{ github.event.issue.body }}
          ISSUE_EOF
          )

          # Extract JSON block from issue body (between ```json and ```)
          JSON_DATA=$(echo "$ISSUE_BODY" | sed -n '/```json/,/```/p' | sed '1d;$d')

          if [ -z "$JSON_DATA" ]; then
            # Try without code fence
            JSON_DATA=$(echo "$ISSUE_BODY" | sed -n '/^{/,/^}/p')
          fi

          if [ -z "$JSON_DATA" ]; then
            echo "No valid JSON found in issue body"
            exit 1
          fi

          echo "Parsed job data: $JSON_DATA"

          # Validate JSON
          echo "$JSON_DATA" | python3 -m json.tool > /dev/null 2>&1
          if [ $? -ne 0 ]; then
            echo "Invalid JSON, trying to fix..."
            # Try to extract just the JSON object
            JSON_DATA=$(echo "$ISSUE_BODY" | grep -A 1000 '^{' | grep -B 1000 '^}' | head -n -1 | tail -n +2)
            if [ -z "$JSON_DATA" ]; then
              JSON_DATA=$(echo "$ISSUE_BODY" | grep -oP '\{.*\}' | head -1)
            fi
          fi

          # Read existing community jobs
          if [ -f jobs-community.json ]; then
            EXISTING=$(cat jobs-community.json)
          else
            EXISTING="[]"
          fi

          # Append new job
          python3 -c "
import json, sys
existing = json.loads('''$EXISTING''')
new_job = json.loads('''$JSON_DATA''')
existing.insert(0, new_job)
with open('jobs-community.json', 'w') as f:
    json.dump(existing, f, ensure_ascii=False, indent=2)
print(f'Updated: {len(existing)} jobs')
          "

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add jobs-community.json
          git diff --staged --quiet || git commit -m "Add community job submission (#${{ github.event.issue.number }})"
          git push

      - name: Comment on issue
        run: |
          gh issue comment ${{ github.event.issue.number }} \
            --body "岗位已成功添加到光学就业网！刷新页面即可看到。感谢你的贡献。" \
            --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Close issue
        run: |
          gh issue close ${{ github.event.issue.number }} \
            --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}